<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email - PayJamm</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #1e293b, #9333ea);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .verify-container {
            background: #18181b;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2.5rem 2rem;
            max-width: 26rem;
            width: 100%;
            color: #fff;
        }
        .verify-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .verify-logo img {
            height: 48px;
        }
        .verify-title {
            font-size: 2rem;
            font-weight: bold;
            color: #f472b6;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .verify-subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .verify-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #a78bfa;
            background: #27272a;
            color: #fff;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 0.3em;
        }
        .verify-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(to right, #9333ea, #f472b6);
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            cursor: pointer;
        }
        .verify-btn:hover {
            background: linear-gradient(to right, #f472b6, #9333ea);
        }
        .verify-link {
            display: block;
            text-align: center;
            color: #a78bfa;
            margin-bottom: 1rem;
            text-decoration: none;
        }
        .verify-link:hover {
            text-decoration: underline;
        }
        .error-message, .success-message {
            display: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .error-message {
            background: #fee2e2;
            color: #991b1b;
        }
        .success-message {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="verify-logo">
            <img src="logo.png" alt="PayJamm" />
        </div>
        <div class="verify-title">Verify Your Email</div>
        <div class="verify-subtitle">We've sent a verification code to your email address. Enter it below to confirm your account.</div>
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <form id="verifyForm" onsubmit="handleVerify(event)">
            <div class="form-group">
                <input type="text" id="verificationCode" class="verify-input" maxlength="6" placeholder="000000" required />
            </div>
            <button type="submit" class="verify-btn">Verify Email</button>
        </form>
        <a href="signin.html" class="verify-link">Back to Sign In</a>
        <div style="text-align:center; margin-top:1rem;">
            <span style="color:#cbd5e1;">Didn't receive a code?</span>
            <button onclick="resendCode()" class="verify-link" style="background:none; border:none; color:#a78bfa; cursor:pointer;">Resend Code</button>
        </div>
    </div>
    <script>
        async function handleVerify(event) {
            event.preventDefault();
            const code = document.getElementById('verificationCode').value;
            const email = sessionStorage.getItem('userEmail');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            if (!code || code.length !== 6) {
                errorMessage.textContent = 'Please enter the 6-digit code.';
                errorMessage.style.display = 'block';
                return;
            }
            try {
                const response = await fetch('https://payjamm-api.gentle-cell-d354.workers.dev/?action=verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                const result = await response.json();
                if (response.ok && result.success) {
                    successMessage.textContent = 'Email verified! Welcome to PayJamm.';
                    successMessage.style.display = 'block';
                    sessionStorage.setItem('userToken', result.token);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);
                } else {
                    errorMessage.textContent = result.error || 'Verification failed.';
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
            }
        }
        async function resendCode() {
            const email = sessionStorage.getItem('userEmail');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            try {
                const response = await fetch('https://payjamm-api.gentle-cell-d354.workers.dev/?action=resend-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();
                if (response.ok && result.success) {
                    successMessage.textContent = 'A new code has been sent to your email.';
                    successMessage.style.display = 'block';
                } else {
                    errorMessage.textContent = result.error || 'Could not resend code.';
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
