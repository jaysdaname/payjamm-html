<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PayJamm</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom right, #faf5ff, #fdf2f8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signin-container {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 28rem;
            width: 100%;
            margin: 1rem;
        }

        .signin-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .signin-logo {
            font-size: 2rem;
            font-weight: bold;
            color: #9333ea;
            margin-bottom: 1rem;
        }

        .signin-title {
            font-size: 1.875rem;
            font-weight: bold;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .signin-subtitle {
            color: #6b7280;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        .signin-button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(to right, #9333ea, #ec4899);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: box-shadow 0.3s ease;
        }

        .signin-button:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .signup-link {
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
            margin-top: 1.5rem;
        }

        .signup-link a {
            color: #9333ea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 2rem;
        }

        .back-home a {
            color: #9333ea;
            text-decoration: none;
            font-size: 0.875rem;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        .error-message {
            display: none;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .success-message {
            display: none;
            background-color: #dcfce7;
            color: #166534;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>

<body style="background: linear-gradient(135deg, #9333ea 0%, #f472b6 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="signin-container" style="background: rgba(255,255,255,0.95); box-shadow: 0 8px 32px rgba(147,51,234,0.12); border-radius: 2rem; padding: 3rem 2rem; max-width: 28rem; width: 100%;">
        <div class="signin-header" style="text-align:center; margin-bottom:2.5rem;">
            <div class="signin-logo" style="margin-bottom:1rem;"><img src="logo.png" alt="PayJamm" style="height:56px;"></div>
            <h1 class="signin-title" style="font-size:2.25rem; font-weight:800; color:#9333ea; margin-bottom:0.5rem;">Sign In</h1>
            <p class="signin-subtitle" style="color:#6b7280; font-size:1.1rem;">Welcome to PayJamm</p>
        </div>
        <div id="errorMessage" class="error-message" style="display:none; background:#fee2e2; color:#991b1b; padding:0.75rem; border-radius:0.5rem; margin-bottom:1.5rem; font-size:1rem;"></div>
        <div id="successMessage" class="success-message" style="display:none; background:#dcfce7; color:#166534; padding:0.75rem; border-radius:0.5rem; margin-bottom:1.5rem; font-size:1rem;"></div>
        <form onsubmit="handleSignIn(event)" style="margin-bottom:2rem;">
            <div class="form-group" style="margin-bottom:1.5rem;">
                <label for="email" style="font-weight:700; color:#9333ea; margin-bottom:0.5rem; font-size:1rem;">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required style="width:100%; padding:0.85rem; border:1.5px solid #d1d5db; border-radius:0.75rem; font-size:1.1rem; margin-top:0.25rem;">
            </div>
            <div class="form-group" style="margin-bottom:1.5rem;">
                <label for="password" style="font-weight:700; color:#9333ea; margin-bottom:0.5rem; font-size:1rem;">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required style="width:100%; padding:0.85rem; border:1.5px solid #d1d5db; border-radius:0.75rem; font-size:1.1rem; margin-top:0.25rem;">
            </div>
            <div style="text-align:right; margin-bottom:1rem;"><a href="#" style="color:#9333ea; font-size:0.95rem; text-decoration:none;">Forgot password?</a></div>
            <button type="submit" class="signin-button" style="width:100%; padding:0.85rem; background:linear-gradient(90deg,#06b6d4,#3b82f6); color:white; font-weight:800; border:none; border-radius:0.75rem; font-size:1.15rem; margin-bottom:1rem; letter-spacing:0.5px;">SIGN IN</button>
        </form>
        <div style="text-align:center; color:#6b7280; font-size:1rem; margin-bottom:1.5rem;">Don't have an account?</div>
        <form id="signupForm" onsubmit="handleSignUp(event)" style="margin-bottom:2rem;">
            <h2 style="text-align:center; font-size:1.25rem; font-weight:700; color:#9333ea; margin-bottom:1rem;">Create your account:</h2>
            <div class="form-group" style="margin-bottom:1.5rem;">
                <label for="signupEmail" style="font-weight:700; color:#9333ea; margin-bottom:0.5rem; font-size:1rem;">Email address</label>
                <input type="email" id="signupEmail" name="signupEmail" placeholder="you@example.com" required style="width:100%; padding:0.85rem; border:1.5px solid #d1d5db; border-radius:0.75rem; font-size:1.1rem; margin-top:0.25rem;">
            </div>
            <div class="form-group" style="margin-bottom:1.5rem;">
                <label for="signupPassword" style="font-weight:700; color:#9333ea; margin-bottom:0.5rem; font-size:1rem;">Password</label>
                <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a password" required style="width:100%; padding:0.85rem; border:1.5px solid #d1d5db; border-radius:0.75rem; font-size:1.1rem; margin-top:0.25rem;">
            </div>
            <button type="submit" class="signin-button" style="width:100%; padding:0.85rem; background:linear-gradient(90deg,#9333ea,#f472b6); color:white; font-weight:800; border:none; border-radius:0.75rem; font-size:1.15rem; margin-bottom:1rem; letter-spacing:0.5px;">SIGN UP</button>
        </form>
        <div class="signup-link" style="text-align:center; color:#9333ea; font-size:1rem; margin-bottom:1.5rem;">Already have an account? <a href="#signin" onclick="showSignIn()" style="color:#3b82f6; text-decoration:underline;">Sign in</a></div>
        <div class="back-home" style="text-align:center; margin-top:2rem;"><a href="index.html" style="color:#9333ea; text-decoration:none; font-size:1rem;">← Back to Home</a></div>
    </div>

    <script>
        function handleSignIn(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMessage.textContent = 'Please enter a valid email address';
                errorMessage.style.display = 'block';
                return;
            }
            // TODO: Replace with real sign-in API call
            sessionStorage.setItem('userEmail', email);
            successMessage.textContent = 'Sign in successful! Redirecting to dashboard...';
            successMessage.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        }

        async function handleSignUp(event) {
            event.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMessage.textContent = 'Please enter a valid email address';
                errorMessage.style.display = 'block';
                return;
            }
            try {
                // Use the correct Worker API endpoint
                const response = await fetch('https://payjamm-api.gentle-cell-d354.workers.dev/?action=signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();
                if (response.ok) {
                    successMessage.textContent = 'Sign up successful! Please check your email for a verification code.';
                    successMessage.style.display = 'block';
                    sessionStorage.setItem('userEmail', email);
                    setTimeout(() => {
                        window.location.href = 'verify.html';
                    }, 1500);
                } else {
                    errorMessage.textContent = result.error || 'Sign up failed.';
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
            }
        }

        function showSignIn() {
            document.getElementById('signupForm').style.display = 'none';
            document.querySelector('form[onsubmit="handleSignIn(event)"]').style.display = 'block';
        }
        // Optionally, you can add logic to toggle between sign in and sign up forms
    </script>
</body>
</html>
